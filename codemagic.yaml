workflows:
  ios-diariamente:
    name: Diariamente iOS (Capacitor)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnectKey
    environment:
      groups:
        - signing
      vars:
        BUNDLE_ID: "club.diariamente.app"
        WIDGET_BUNDLE_ID: "club.diariamente.app.widget"
        # Team ID (PASSO-A-PASSO-APPLE.md). O script do widget usa se o target App nao tiver
        # DEVELOPMENT_TEAM; `xcode-project use-profiles` sobrescreve com o team do profile.
        DEVELOPMENT_TEAM: "3UD3Q534G6"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Gerar projeto iOS
        script: |
          npx cap sync ios
      - name: Copiar fontes do widget para ios/App
        script: |
          set -e
          test -f DiariamenteWidget/DiariamenteWidget.swift || { echo "ERRO: DiariamenteWidget/DiariamenteWidget.swift nao existe no repo"; exit 1; }
          test -f DiariamenteWidget/Info.plist || { echo "ERRO: DiariamenteWidget/Info.plist nao existe no repo"; exit 1; }
          mkdir -p ios/App/DiariamenteWidget
          cp -R DiariamenteWidget/. ios/App/DiariamenteWidget/
          ls -la ios/App/DiariamenteWidget
      - name: Adicionar target DiariamenteWidget ao Xcode project (xcodeproj gem, idempotente)
        script: |
          set -e
          ruby -v
          ruby -e "require 'xcodeproj'; puts 'xcodeproj ' + Xcodeproj::VERSION" 2>/dev/null \
            || gem install xcodeproj --no-document --user-install
          ruby scripts/add_widget_target.rb
      - name: Forcar idioma pt-BR no binario (principal) e declarar espanhol
        script: |
          set -e
          PLIST="ios/App/App/Info.plist"
          PBX="ios/App/App.xcodeproj/project.pbxproj"
          # Idiomas do binario: pt-BR e o principal; es entra para quem usa o iPhone em
          # espanhol (America Latina e Espanha). O WKWebView so reporta navigator.language
          # num idioma que o app declara: com es no binario, um iPhone em espanhol abre as
          # telas iniciais do site em espanhol em qualquer fuso, e as folhas do sistema e os
          # pedidos de permissao tambem saem em espanhol. Qualquer outro idioma sem
          # localizacao (ingles etc.) cai no pt-BR, e o WKWebView diz portugues: ai o site
          # decide as telas iniciais pelo fuso do aparelho (escolherIdiomaInicial no repo
          # diariamente; fuso de pais de lingua espanhola, es). O iOS passa a mostrar
          # Ajustes > Diariamente > Idioma preferido. Ingles continua fora do binario.
          # 1) Idioma principal do app = Portugues do Brasil (era 'en' por padrao do Capacitor)
          /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion pt-BR" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string pt-BR" "$PLIST"
          # 2) Localizacoes do bundle: pt-BR, pt (Portugal, usa os textos do Info.plist) e es
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:0 string pt-BR" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:1 string pt" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations:2 string es" "$PLIST"
          # 3) InfoPlist.strings versionados no repo (nome do app e permissao das Fotos)
          for loc in pt-BR es; do
            f="ios/App/App/$loc.lproj/InfoPlist.strings"
            test -f "$f" || { echo "ERRO: $f nao existe no repo"; exit 1; }
            plutil -lint "$f"
          done
          # 4) Projeto Xcode: developmentRegion pt-BR, knownRegions (pt-BR, es, Base) e o
          #    grupo de variantes InfoPlist.strings em Resources do App. Sem esse grupo as
          #    pastas .lproj nao entram no .app (xcodeproj gem, idempotente)
          ruby -e "require 'xcodeproj'" 2>/dev/null \
            || gem install xcodeproj --no-document --user-install
          ruby scripts/add_app_localizations.rb
          echo "=== CONFERENCIA DE IDIOMA ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$PLIST"
          grep -n "developmentRegion" "$PBX" || true
          grep -n -A5 "knownRegions" "$PBX" || true
          grep -n "InfoPlist.strings" "$PBX" || true
      - name: Baixar icone oficial e gerar
        script: |
          mkdir -p assets
          # ÍCONE do app: vem de assets/icon.png commitado no repo (sem download externo).
          # SPLASH — arte oficial única (SPLASH-DIARIAMENTE-001).
          # Fonte da verdade: docs/SPLASH-DIARIAMENTE-001.md neste repositório.
          # Esta arte alimenta a LaunchScreen, que é a ÚNICA splash do app. O web layer
          # não desenha splash em plataforma nativa — não existe segunda arte pra "emendar".
          # Canvas 2732x2732 com fundo #0A0E0E; o iPhone recorta ~1250px centrais, por isso
          # o wordmark é gerado pequeno (~450px) para não estourar na tela.
          curl -fL -o assets/splash.png "https://app.diariamente.club/splash-ios.png"
          npx @capacitor/assets generate --ios
      - name: Criar certificado e profile
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create
          keychain add-certificates
      - name: Instalar Pods
        script: |
          cd ios/App && pod install
      - name: Aplicar profile no projeto
        script: |
          xcode-project use-profiles
      - name: Conferir que use-profiles cobriu App e Widget
        script: |
          set -e
          echo "=== ~/export_options.plist ==="
          cat ~/export_options.plist
          for b in "$BUNDLE_ID" "$WIDGET_BUNDLE_ID"; do
            /usr/libexec/PlistBuddy -c "Print :provisioningProfiles:$b" ~/export_options.plist >/dev/null \
              || { echo "ERRO: nenhum provisioning profile aplicado para $b (fetch-signing-files falhou ou o Bundle ID nao existe no portal)"; exit 1; }
          done
          echo "=== Assinatura por target ==="
          grep -nE 'PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PRODUCT_BUNDLE_IDENTIFIER' ios/App/App.xcodeproj/project.pbxproj
      - name: Definir versao (1.0.6) e build number
        script: |
          cd ios/App
          # 1.0.5 ja esta publicada na App Store; 1.0.6 traz o plugin InstagramShare.
          agvtool new-marketing-version 1.0.6
          agvtool new-version -all "$BUILD_NUMBER"
          echo "=== CONFERENCIA DE VERSAO (App e Widget devem ser iguais) ==="
          grep -o 'MARKETING_VERSION = [^;]*' App.xcodeproj/project.pbxproj | sort | uniq -c
          grep -o 'CURRENT_PROJECT_VERSION = [^;]*' App.xcodeproj/project.pbxproj | sort | uniq -c
          [ "$(grep -o 'MARKETING_VERSION = [^;]*' App.xcodeproj/project.pbxproj | sort -u | wc -l | tr -d ' ')" = "1" ] \
            || { echo "ERRO: MARKETING_VERSION divergente entre targets"; exit 1; }
          [ "$(grep -o 'CURRENT_PROJECT_VERSION = [^;]*' App.xcodeproj/project.pbxproj | sort -u | wc -l | tr -d ' ')" = "1" ] \
            || { echo "ERRO: CURRENT_PROJECT_VERSION divergente entre targets"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" DiariamenteWidget/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" DiariamenteWidget/Info.plist
      - name: Build do ipa
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "$XCODE_SCHEME"
      - name: Conferir idiomas dentro do .ipa
        script: |
          set -e
          # Confere no binario que vai para o TestFlight o que o passo de idiomas preparou:
          # pt-BR principal, pt-BR e es no CFBundleLocalizations e as duas pastas .lproj
          # dentro do .app. Se faltar algo, o build para aqui e nada sobe.
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "ERRO: nenhum .ipa em build/ios/ipa"; exit 1; }
          TMP=$(mktemp -d)
          unzip -q "$IPA" -d "$TMP"
          APP_DIR=$(find "$TMP/Payload" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP_DIR" || { echo "ERRO: nenhum .app dentro de $IPA"; exit 1; }
          echo "=== IDIOMAS NO .ipa ($(basename "$IPA")) ==="
          REGION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$APP_DIR/Info.plist")
          echo "CFBundleDevelopmentRegion = $REGION"
          [ "$REGION" = "pt-BR" ] || { echo "ERRO: idioma principal $REGION (esperado pt-BR)"; exit 1; }
          LANGS=$(/usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$APP_DIR/Info.plist")
          echo "CFBundleLocalizations = $LANGS"
          for loc in pt-BR es; do
            echo "$LANGS" | grep -qx "[[:space:]]*$loc" || { echo "ERRO: $loc fora do CFBundleLocalizations"; exit 1; }
            f="$APP_DIR/$loc.lproj/InfoPlist.strings"
            test -f "$f" || { echo "ERRO: $loc.lproj/InfoPlist.strings fora do .app"; ls -la "$APP_DIR"; exit 1; }
            plutil -extract NSPhotoLibraryAddUsageDescription raw -o - "$f" >/dev/null \
              || { echo "ERRO: $loc.lproj/InfoPlist.strings sem NSPhotoLibraryAddUsageDescription"; exit 1; }
            echo "--- $loc.lproj/InfoPlist.strings"
            plutil -p "$f"
          done
          rm -rf "$TMP"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
