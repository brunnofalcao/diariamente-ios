<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diariamente</title>
<!--
  TELA DE FALHA DE CARREGAMENTO (offline / servidor fora)

  Carregada pelo Capacitor (server.errorPath) quando a WebView não consegue abrir
  app.diariamente.club. Roda de capacitor://localhost, a partir do bundle.

  Por isso ela é 100% self-contained: nenhuma fonte, imagem ou script remoto.
  Qualquer dependência de rede aqui derrubaria justamente a tela que existe para
  o caso de não haver rede.

  Segue a SPLASH-DIARIAMENTE-001 no fundo e na cor, mas NÃO é uma splash: não tem
  marca, não anima e não some sozinha. É interface real, com saída.

  Fala pt-BR ou es, pela regra do site para o app iOS (ver o script no fim).
-->
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0A0E0E;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  main {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 32px;
    padding-top: calc(32px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 700; color: #fff; }
  p  { margin: 0; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.6); max-width: 300px; }
  button {
    margin-top: 8px; border: none; border-radius: 22px;
    padding: 13px 30px; font-size: 14px; font-weight: 700;
    font-family: inherit; background: #27BDBE; color: #06110F;
  }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Sem conexão</h1>
  <p id="texto">Não foi possível abrir o Diariamente agora. Confira sua internet e tente de novo.</p>
  <button id="retry" type="button">Tentar novamente</button>
</main>

<script>
(function () {
  var APP = 'https://app.diariamente.club';
  var btn = document.getElementById('retry');

  // Idioma: a mesma regra do site antes do login no app iOS (escolherIdiomaInicial no
  // public/index.html do repo diariamente). O primeiro es ou pt da lista de idiomas decide: es
  // vale (o binário declara es, então um iPhone em espanhol diz es); pt não prova nada, porque o
  // WKWebView diz português com o iPhone em português, em inglês ou em qualquer idioma que o
  // binário não declara. Sem es, decide o fuso do aparelho: país de língua espanhola (América
  // Latina e Espanha), es; os demais, pt-BR. FUSOS_ES é cópia da lista de public/privacidade.html
  // do site (as estáticas e o mapa TZ_PAIS do app dizem o mesmo): fuso novo entra nos dois repos.
  // Esta tela roda no bundle (capacitor://localhost), outra origem, e não enxerga o idioma salvo
  // pelo site. Troca antes de soltar a splash: o português não pisca.
  var TEXTOS = {
    'pt-BR': {
      titulo: 'Sem conexão',
      texto: 'Não foi possível abrir o Diariamente agora. Confira sua internet e tente de novo.',
      botao: 'Tentar novamente',
      conectando: 'Conectando…'
    },
    es: {
      titulo: 'Sin conexión',
      texto: 'No se pudo abrir Diariamente en este momento. Revisa tu conexión e intenta de nuevo.',
      botao: 'Intentar de nuevo',
      conectando: 'Conectando…'
    }
  };
  var FUSOS_ES = /^(Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta|Pacific\/(Easter|Galapagos)|America\/(Mexico_City|Cancun|Merida|Monterrey|Matamoros|Chihuahua|Ciudad_Juarez|Ojinaga|Mazatlan|Bahia_Banderas|Hermosillo|Tijuana|Buenos_Aires|Cordoba|Mendoza|Jujuy|Catamarca|Argentina\/(Buenos_Aires|Cordoba|Mendoza|Salta|Tucuman|Jujuy|Catamarca|La_Rioja|San_Juan|San_Luis|Rio_Gallegos|Ushuaia)|Santiago|Punta_Arenas|Coyhaique|Bogota|Lima|La_Paz|Montevideo|Asuncion|Caracas|Guayaquil|Costa_Rica|Panama|Guatemala|El_Salvador|Tegucigalpa|Managua|Havana|Santo_Domingo|Puerto_Rico))$/;
  function idiomaDoAparelho() {
    var lista = [];
    try { lista = Array.prototype.slice.call(navigator.languages || []); } catch (_) {}
    lista.push(navigator.language || navigator.userLanguage);
    for (var i = 0; i < lista.length; i++) {
      var base = String(lista[i] || '').toLowerCase().split(/[-_]/)[0];
      if (base === 'es') return 'es';
      if (base === 'pt') break;
    }
    try { return FUSOS_ES.test(Intl.DateTimeFormat().resolvedOptions().timeZone || '') ? 'es' : 'pt-BR'; }
    catch (_) { return 'pt-BR'; }
  }
  var LOCALE = idiomaDoAparelho();
  var T = TEXTOS[LOCALE];
  if (LOCALE !== 'pt-BR') {
    document.documentElement.lang = LOCALE;
    document.getElementById('titulo').textContent = T.titulo;
    document.getElementById('texto').textContent = T.texto;
    btn.textContent = T.botao;
  }

  // A splash nativa está segurada esperando o app chegar a READY — coisa que este
  // documento nunca vai fazer. Solta ela agora, senão o usuário fica olhando a
  // marca até o watchdog do AppDelegate estourar, sem ver esta tela.
  try {
    var P = window.Capacitor && window.Capacitor.Plugins;
    if (P && P.SplashScreen && P.SplashScreen.hide) P.SplashScreen.hide({ fadeOutDuration: 250 });
  } catch (_) {}

  function retry() {
    btn.disabled = true;
    btn.textContent = T.conectando;
    window.location.replace(APP);
  }

  btn.addEventListener('click', retry);

  // Voltou a rede: reentra sozinho, sem o usuário precisar tocar em nada.
  // É evento do sistema, não polling.
  window.addEventListener('online', retry);
})();
</script>
</body>
</html>
